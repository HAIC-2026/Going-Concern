name: Validate Going Concern Workspace
on:
  push:
    branches: [feature/competition-workspace, fix/unified-ui-theme, fix/single-sidebar-layout, fix/sidebar-polish-final, fix/use-opportunity-sidebar-on-home, fix/home-leaflet-navigation-crash, fix/map-remount-tilelayer]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build
